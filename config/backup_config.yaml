# ─────────────────────────────────────────────────────────────────────────────
# Frigate NVR - Config mapped from Agent DVR objects.json
# Generated from 53 cameras (active and inactive from objects.json)
#
# RTSP Stream URL convention used:
#   substream (detect) : rtsp://user:pass@IP:554/live/0/SUB
#   mainstream (record): rtsp://user:pass@IP:554/live/0/MAIN
# Cameras with explicit RTSP URLs from Agent DVR notes are used directly.
# Inactive cameras (disabled in Agent DVR) are kept but set enabled: false.
# ─────────────────────────────────────────────────────────────────────────────

mqtt:
  enabled: true
  host: mqtt # matches 'mqtt' service in docker-compose.dev.yml
  port: 1883
  # user: your_user
  # password: your_pass

# ─────────────────────────────────────────────────────────────────────────────
# Detector — CPU default. Swap to coral/openvino for hardware acceleration.
# ─────────────────────────────────────────────────────────────────────────────
detectors:
  cpu1:
    type: cpu
    num_threads: 4

# ─────────────────────────────────────────────────────────────────────────────
# Global object tracking
# ─────────────────────────────────────────────────────────────────────────────
objects:
  track:
    - person
    - car
    - motorcycle
    - truck

# ─────────────────────────────────────────────────────────────────────────────
# Recording & snapshots defaults
# ─────────────────────────────────────────────────────────────────────────────
record:
  enabled: true
  retain:
    days: 7
    mode: motion

snapshots:
  enabled: true
  retain:
    default: 14

# ─────────────────────────────────────────────────────────────────────────────
# Camera Groups (mirrored from Agent DVR layouts)
# ─────────────────────────────────────────────────────────────────────────────
camera_groups:
  1st_floor:
    order: 1
    cameras:
      - plating_lab
      - east_factory_st
      - ruang_bayi
      - parking_motorbike
      - front_yard
      - md_retail
      - packing_shipment
      - parts_area
      - casting_admin
      - gas_storage
      - production_admin
      - sanding_production
      - casting_melting
      - blendes
      - polesh_workers
      - polesh_admin
      - resin_workers
      - plating_admin
      - body_check_raw

  2nd_floor:
    order: 2
    cameras:
      - mesh_entry_warehouse
      - rnd_design
      - gold_entrance
      - rubber_admin
      - production_workers_west
      - gold_tukang_west
      - gold_tukang_east
      - gold_admin
      - production_admin_west
      - wax_inject
      - wax_admin
      - electric_welding
      - engineering_machine
      - engineering_panel
      - rnd_admin
      - prod_tukang_east
      - thumbling_workers

  wisewool:
    order: 3
    cameras:
      - wisewool_parking
      - wisewool_hallway
